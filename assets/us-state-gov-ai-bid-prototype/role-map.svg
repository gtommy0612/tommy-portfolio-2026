<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -30 1880 680" width="1880" height="680" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>How the five parties connect</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="-60" y="-30" width="1880" height="680" fill="#FFFFFF"/>

  <!-- Oversight lines (dashed) -->
  <g fill="none" stroke="#86868B" stroke-width="2.5" stroke-dasharray="12 10" stroke-linecap="round">
    <path d="M160 190 V455 Q160 475 180 475 H700"/>
    <path d="M1600 190 V455 Q1600 475 1580 475 H1060"/>
    <path d="M640 190 V250 Q640 270 660 270 H860 Q880 270 880 290 V400"/>
    <path d="M1120 190 V250 Q1120 270 1100 270 H900 Q880 270 880 290"/>
  </g>

  <!-- Hand-offs (solid arrows) -->
  <g fill="none" stroke="#6E6E73" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)">
    <path d="M316 125 H484"/>
    <path d="M796 125 H964"/>
    <path d="M1276 125 H1444"/>
  </g>
  <g font-size="20" fill="#6E6E73" text-anchor="middle">
    <text x="400" y="106">Submits</text>
    <text x="880" y="106">Clears for course</text>
    <text x="1360" y="106">Clears to buy</text>
  </g>

  <!-- Roles -->
  <g fill="#FFFFFF" stroke="#1D1D1F" stroke-width="3">
    <rect x="20" y="50" width="280" height="140" rx="16"/>
    <rect x="500" y="50" width="280" height="140" rx="16"/>
    <rect x="980" y="50" width="280" height="140" rx="16"/>
    <rect x="1460" y="50" width="280" height="140" rx="16"/>
    <rect x="700" y="400" width="360" height="150" rx="16"/>
  </g>
  <g text-anchor="middle">
    <g font-size="32" font-weight="700" fill="#1D1D1F" letter-spacing="-0.5">
      <text x="160" y="116">Applicant</text>
      <text x="640" y="116">Sheriff</text>
      <text x="1120" y="116">Instructor</text>
      <text x="1600" y="116">Dealer</text>
      <text x="880" y="460">State Admin</text>
    </g>
    <g font-size="20" fill="#6E6E73">
      <text x="160" y="152">Fills in the application</text>
      <text x="640" y="152">Reviews the application</text>
      <text x="1120" y="152">Records course results</text>
      <text x="1600" y="152">Sells the firearm</text>
      <text x="880" y="496">Reviews course eligibility</text>
      <text x="880" y="524">and runs admin tools</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-size="18" fill="#6E6E73">
    <path d="M1300 590 H1340" stroke="#6E6E73" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="1352" y="596">Hands off</text>
    <path d="M1490 590 H1540" stroke="#86868B" stroke-width="2.5" stroke-dasharray="12 10"/>
    <text x="1552" y="596">Oversees</text>
  </g>
</svg>
